<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>模組 07 — 全球 AI 模型與產業動態觀測</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0D1E25;
  --surface:#142C36;
  --raised:#1B3A46;
  --paper:#E6EDEA;
  --muted:#7E97A0;
  --hairline:#2C4B57;
  --verified:#7FC7A6;
  --vendor:#E0A24F;
  --thirdparty:#A2AEDB;
  --unverified:#6E8892;
  --alarm:#E4705C;
  --serif:"Noto Serif TC",serif;
  --sans:"Noto Sans TC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ink);color:var(--paper);
  font-family:var(--sans);font-size:15px;line-height:1.75;
  font-feature-settings:"palt" 1;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px 96px}
a{color:inherit}

/* ---------- masthead ---------- */
.masthead{padding:56px 0 32px;border-bottom:1px solid var(--hairline)}
.mod{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.masthead h1{
  font-family:var(--serif);font-weight:700;
  font-size:clamp(28px,5.2vw,46px);line-height:1.2;margin:14px 0 0;letter-spacing:.01em;
}
.meta{
  display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:22px;
  font-family:var(--mono);font-size:12px;color:var(--muted);
}
.meta b{color:var(--paper);font-weight:500}

/* ---------- thesis ---------- */
.thesis{
  margin:38px 0 0;padding:26px 28px;
  background:var(--surface);border-left:3px solid var(--verified);
}
.thesis .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.thesis p{margin:12px 0 0;font-size:16px;line-height:1.9}

/* ---------- track board ---------- */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hairline);margin-top:34px;border:1px solid var(--hairline)}
.cell{background:var(--ink);padding:18px 16px 16px;min-height:132px;display:flex;flex-direction:column;gap:8px}
.cell .tk{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1}
.cell .nm{font-size:13px;font-weight:500;line-height:1.5}
.cell .st{font-family:var(--mono);font-size:11px;letter-spacing:.08em;margin-top:auto;color:var(--muted)}
.cell.has .tk{color:var(--verified)}
.cell.quiet .tk{color:var(--unverified)}
.cell.quiet{background:#0B1A20}

/* ---------- filters ---------- */
.filters{margin:44px 0 0;padding-bottom:14px;border-bottom:1px solid var(--hairline)}
.frow{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:10px}
.frow .fl{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;min-width:86px}
.chip{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;
  padding:4px 11px;border:1px solid var(--hairline);border-radius:999px;
  background:none;color:var(--muted);cursor:pointer;
  transition:border-color .15s,color .15s,background .15s;
}
.chip:hover{border-color:var(--muted);color:var(--paper)}
.chip[aria-pressed="true"]{background:var(--raised);border-color:var(--muted);color:var(--paper)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.chip .dot.hollow{background:none;border:1px solid var(--unverified)}
.chip:focus-visible,.wk:focus-visible{outline:2px solid var(--thirdparty);outline-offset:2px}

/* ---------- ledger ---------- */
.count{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);margin:22px 0 4px;text-transform:uppercase}
.entry{
  border-top:1px solid var(--hairline);padding:26px 0 24px;
  display:grid;grid-template-columns:64px 1fr;gap:0 22px;
}
.entry.dashed{border-top-style:dashed}
.entry .rail{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.6}
.entry .rail .tkid{font-size:22px;font-weight:600;color:var(--hairline);display:block;line-height:1}
.entry h3{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.45;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.05em;padding:3px 9px;border-radius:2px;border:1px solid transparent}
.tag.ev-verified{background:rgba(127,199,166,.14);color:var(--verified);border-color:rgba(127,199,166,.4)}
.tag.ev-vendor{background:rgba(224,162,79,.14);color:var(--vendor);border-color:rgba(224,162,79,.4)}
.tag.ev-thirdparty{background:rgba(162,174,219,.14);color:var(--thirdparty);border-color:rgba(162,174,219,.4)}
.tag.ev-unverified{background:none;color:var(--unverified);border-color:var(--unverified);border-style:dashed}
.tag.pri{color:var(--muted);border-color:var(--hairline)}
.tag.pri.p0{color:var(--alarm);border-color:var(--alarm)}
.tag.imp{color:var(--muted);border-color:var(--hairline);opacity:.85}

/* signature: the state transition line */
.delta{
  font-family:var(--mono);font-size:12.5px;line-height:1.9;
  margin-top:16px;padding:11px 14px;background:var(--surface);
  display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;
}
.delta .from{color:var(--muted)}
.delta .arrow{color:var(--verified);font-weight:600}
.delta .to{color:var(--paper)}
.entry.dashed .delta .arrow{color:var(--unverified)}

.entry p.detail{margin:14px 0 0;color:#CBD8D6;font-size:14.5px}
.srcs{margin:14px 0 0;padding:0;list-style:none;font-family:var(--mono);font-size:11.5px;line-height:1.85}
.srcs li{color:var(--muted)}
.srcs a{color:var(--thirdparty);text-decoration:none;border-bottom:1px solid rgba(162,174,219,.3)}
.srcs a:hover{border-bottom-color:var(--thirdparty)}
.tierbadge{color:var(--muted);border:1px solid var(--hairline);padding:0 5px;margin-right:8px;border-radius:2px;font-size:10.5px}

/* ---------- sections ---------- */
h2.sec{
  font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);font-weight:500;margin:66px 0 0;padding-bottom:10px;border-bottom:1px solid var(--hairline);
}
.counter{border-top:1px solid var(--hairline);padding:22px 0;display:grid;grid-template-columns:64px 1fr;gap:0 22px}
.counter:first-of-type{border-top:none}
.counter .rail{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--hairline);line-height:1}
.counter p{margin:0;font-size:14.5px;color:#CBD8D6}
.archive{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.yr{margin-top:24px}
.yrl{font-family:var(--mono);font-size:13px;letter-spacing:.1em;color:var(--paper);border-bottom:1px solid var(--hairline);padding-bottom:6px}
.yrl span{color:var(--muted);font-size:11px;letter-spacing:.06em;margin-left:8px}
.retnote{margin-top:28px;font-size:13px;line-height:1.85;color:var(--muted);border-left:2px solid var(--hairline);padding-left:16px}
footer code{font-family:var(--mono);font-size:10.5px;color:var(--thirdparty)}
.wk{
  font-family:var(--mono);font-size:12px;padding:8px 14px;
  border:1px solid var(--hairline);background:none;color:var(--paper);cursor:pointer;
}
.wk[aria-pressed="true"]{background:var(--raised);border-color:var(--muted)}
.wk small{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em;margin-top:2px}

/* ---------- states ---------- */
.notice{margin:44px 0;padding:26px 28px;background:var(--surface);border:1px dashed var(--hairline)}
.notice h2{font-family:var(--serif);font-size:19px;margin:0 0 10px}
.notice code{font-family:var(--mono);font-size:12.5px;background:var(--ink);padding:2px 6px}
.empty{padding:40px 0;color:var(--muted);font-family:var(--mono);font-size:12.5px;border-top:1px solid var(--hairline)}
footer{margin-top:72px;padding-top:22px;border-top:1px solid var(--hairline);font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.9}

@media(max-width:820px){
  .board{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
  .wrap{padding:0 18px 72px}
  .board{grid-template-columns:1fr}
  .entry,.counter{grid-template-columns:1fr;gap:12px}
  .entry .rail,.counter .rail{display:flex;align-items:baseline;gap:12px}
  .entry .rail .tkid{display:inline;font-size:18px}
  .frow .fl{min-width:100%}
}
@media(prefers-reduced-motion:no-preference){
  .entry{animation:rise .4s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="empty">載入中…</div>
</div>

<script>
const SEED = null;

const EV = {
  verified:    { key:"verified",    label:"已證實" },
  vendor:      { key:"vendor",      label:"廠商主張" },
  thirdparty:  { key:"thirdparty",  label:"第三方評論" },
  unverified:  { key:"unverified",  label:"尚未證實" }
};
const TRACK_STATUS = {
  changed:  "本期有變更",
  unchanged:"本期無變更",
  baseline: "基線建立",
  failed:   "本期檢索失敗"
};
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const state = { idx:null, week:null, data:null, f:{ track:null, ev:null, pri:null } };

async function jget(p){
  const r = await fetch(p, { cache:"no-store" });
  if(!r.ok) throw new Error(p + " → HTTP " + r.status);
  return r.json();
}

async function boot(){
  try{
    state.idx = await jget("data/index.json");
    const want = new URLSearchParams(location.search).get("week");
    const w = (want && state.idx.weeks.find(x => x.week === want)) || state.idx.weeks[0];
    state.week = w.week;
    state.data = await jget("data/" + w.file);
  }catch(err){
    if(!SEED){ return renderOffline(err); }
    state.idx = { weeks:[{ week:SEED.week, period_end:SEED.period.end, mode:SEED.mode, file:"" }] };
    state.week = SEED.week;
    state.data = SEED;
    render(true);
    return;
  }
  render(false);
}

async function pickWeek(week){
  const w = state.idx.weeks.find(x => x.week === week);
  if(!w || week === state.week) return;
  try{
    state.data = await jget("data/" + w.file);
    state.week = week;
    state.f = { track:null, ev:null, pri:null };
    render(false);
    window.scrollTo({ top:0, behavior:"smooth" });
  }catch(err){ renderOffline(err); }
}

function renderOffline(err){
  document.getElementById("app").innerHTML = `
    <div class="masthead">
      <div class="mod">模組 07 · Inventec 全球資安管理處</div>
      <h1>全球 AI 模型與產業動態觀測</h1>
    </div>
    <div class="notice">
      <h2>資料檔讀取失敗</h2>
      <p>這個頁面從 <code>data/index.json</code> 讀取每期報告，瀏覽器不允許以 <code>file://</code> 直接讀取本機檔案。要在本機預覽，在此目錄執行 <code>python3 -m http.server 8080</code>，再開啟 <code>http://localhost:8080</code>。部署到 GitHub Pages 後即正常運作。</p>
      <p style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:14px">${esc(err && err.message)}</p>
    </div>`;
}

function render(seeded){
  const d = state.data;
  const period = d.period.start + " ～ " + d.period.end;
  const modeLabel = d.mode === "baseline" ? "基線建立版（無 Delta 比對）" : "Delta 模式";

  const board = ["A","B","C","D"].map(k => {
    const t = d.tracks[k] || { name:"—", status:"unchanged" };
    const live = t.status === "changed" || t.status === "baseline" || t.status === "failed";
    const n = (d.entries || []).filter(e => e.track === k).length;
    return `<div class="cell ${live ? "has" : "quiet"}">
      <span class="tk">${k}</span>
      <span class="nm">${esc(t.name)}</span>
      <span class="st">${esc(TRACK_STATUS[t.status] || t.status)} · ${n} 則</span>
    </div>`;
  }).join("");

  const evChips = Object.values(EV).map(e => {
    const on = state.f.ev === e.key;
    const hollow = e.key === "unverified" ? " hollow" : "";
    return `<button class="chip" data-f="ev" data-v="${e.key}" aria-pressed="${on}">
      <span class="dot${hollow}" style="background:${e.key === "unverified" ? "none" : "var(--" + e.key + ")"}"></span>${e.label}</button>`;
  }).join("");

  const trackChips = ["A","B","C","D"].map(k =>
    `<button class="chip" data-f="track" data-v="${k}" aria-pressed="${state.f.track === k}">${k} 軌</button>`).join("");

  const priChips = ["P0","P1","P2","P3"].map(p =>
    `<button class="chip" data-f="pri" data-v="${p}" aria-pressed="${state.f.pri === p}">${p}</button>`).join("");

  const shown = (d.entries || []).filter(e =>
    (!state.f.track || e.track === state.f.track) &&
    (!state.f.ev || e.evidence === state.f.ev) &&
    (!state.f.pri || e.priority === state.f.pri));

  const ledger = shown.length
    ? shown.map(e => {
        const ev = EV[e.evidence] || EV.unverified;
        const dashed = e.evidence === "unverified" ? " dashed" : "";
        const imp = (e.impact || []).map(i => `<span class="tag imp">${esc(i)}</span>`).join("");
        const srcs = (e.sources || []).map(s => {
          const link = s.url
            ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`
            : esc(s.title);
          return `<li><span class="tierbadge">T${esc(s.tier)}</span>${esc(s.org)} · ${link} · ${esc(s.date)}</li>`;
        }).join("");
        return `<article class="entry${dashed}">
          <div class="rail"><span class="tkid">${esc(e.track)}</span>${esc(e.id.split("-").pop())}</div>
          <div>
            <h3>${esc(e.title)}</h3>
            <div class="tags">
              <span class="tag ev-${ev.key}">${ev.label}</span>
              <span class="tag pri ${e.priority === "P0" ? "p0" : ""}">${esc(e.priority)}</span>
              ${imp}
            </div>
            <div class="delta">
              <span class="from">${esc(e.prev_state)}</span>
              <span class="arrow">⟶</span>
              <span class="to">${esc(e.curr_state)}</span>
            </div>
            <p class="detail">${esc(e.detail)}</p>
            <ul class="srcs">${srcs}</ul>
          </div>
        </article>`;
      }).join("")
    : `<div class="empty">目前篩選條件下沒有項目。清除篩選即可看到本期全部 ${(d.entries || []).length} 則。</div>`;

  const counters = (d.counter_views || []).map((c, i) => {
    const s = c.source || {};
    const link = s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title);
    return `<div class="counter">
      <div class="rail">${String(i + 1).padStart(2,"0")}</div>
      <div>
        <p>${esc(c.point)}</p>
        <ul class="srcs"><li><span class="tierbadge">T${esc(s.tier)}</span>${esc(s.org)} · ${link} · ${esc(s.date)}</li></ul>
      </div>
    </div>`;
  }).join("");

  const byYear = {};
  state.idx.weeks.forEach(w => { (byYear[w.week.split("-")[0]] ||= []).push(w); });
  const archive = Object.keys(byYear).sort().reverse().map(y => {
    const rows = byYear[y].map(w =>
      `<button class="wk" data-week="${esc(w.week)}" aria-pressed="${w.week === state.week}">${esc(w.week.split("-")[1])}<small>${esc(w.period_end)} · ${w.mode === "baseline" ? "基線" : "Delta"}</small></button>`).join("");
    return `<div class="yr"><div class="yrl">${esc(y)} <span>${byYear[y].length} 期</span></div><div class="archive">${rows}</div></div>`;
  }).join("");
  const ret = (state.idx.retention || {});

  document.getElementById("app").innerHTML = `
    <div class="masthead">
      <div class="mod">模組 07 · Inventec 全球資安管理處 · <a href="archive.html" style="color:var(--thirdparty);text-decoration:none;border-bottom:1px solid rgba(162,174,219,.35)">歷期查詢 →</a></div>
      <h1>全球 AI 模型與產業動態觀測</h1>
      <div class="meta">
        <span>期別 <b>${esc(d.week)}</b></span>
        <span>觀測期間 <b>${esc(period)}</b></span>
        <span>模式 <b>${esc(modeLabel)}</b></span>
        <span>本期項目 <b>${(d.entries || []).length}</b></span>
      </div>
    </div>

    <section class="thesis">
      <div class="lbl">管理階層摘要</div>
      <p>${esc(d.exec_summary)}</p>
    </section>

    <div class="board">${board}</div>

    <div class="filters">
      <div class="frow"><span class="fl">軌別</span>${trackChips}</div>
      <div class="frow"><span class="fl">證據等級</span>${evChips}</div>
      <div class="frow"><span class="fl">優先級</span>${priChips}</div>
    </div>

    <div class="count">Delta 逐項紀錄 — 顯示 ${shown.length} / ${(d.entries || []).length} 則</div>
    ${ledger}

    <h2 class="sec">風險與反面觀點</h2>
    ${counters || '<div class="empty">本期未記錄反面觀點。此欄為必填 —— 若為空，視為報告未完成。</div>'}

    <h2 class="sec">歷期 — 保留至少 ${esc(ret.min_months || 12)} 個月</h2>
    ${archive}
    <div class="retnote">${esc(ret.policy || "")}</div>

    <footer>
      模組 07 · 每週一 08:00 (Asia/Taipei) 由 GitHub Actions 排程產出 · 內部技術情報，僅供內部使用<br>
      方法論版本受控於 <code>prompts/module-07.md</code>；輸出 schema 與驗證規則見 <code>docs/SCHEMA.md</code><br>
      證據等級四級制：已證實 / 廠商主張 / 第三方評論 / 尚未證實。廠商自評 benchmark 一律歸【廠商主張】。<br>
      來源分級：T1 廠商官方一手文件與主管機關公告 · T2 具編輯審查的專業媒體與獨立評測 · T3 部落格、社群、分析師評論
      ${seeded ? "<br><span style='color:var(--vendor)'>目前顯示的是頁面內建的種子資料（data/ 讀取失敗）。</span>" : ""}
    </footer>`;

  document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.f, v = b.dataset.v;
    state.f[k] = state.f[k] === v ? null : v;
    render(seeded);
  }));
  document.querySelectorAll(".wk").forEach(b => b.addEventListener("click", () => pickWeek(b.dataset.week)));
}

boot();
</script>
</body>
</html>
