<!DOCTYPE html>
<html lang="zh-Hant" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資安合規週報 | Security & Compliance Weekly</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #eef0f4;
    --text: #1a1d23;
    --text-2: #5b6472;
    --border: #dde1e8;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --high: #dc2626;
    --high-soft: #fee2e2;
    --medium: #d97706;
    --medium-soft: #fef3c7;
    --low: #059669;
    --low-soft: #d1fae5;
    --shadow: 0 1px 3px rgba(16, 24, 40, .08), 0 1px 2px rgba(16, 24, 40, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418;
      --surface: #1a1f26;
      --surface-2: #232a33;
      --text: #e8eaee;
      --text-2: #9aa4b2;
      --border: #2e3742;
      --accent: #5b95f5;
      --accent-soft: #1e3a5f;
      --high: #f47272;
      --high-soft: #4a1d1d;
      --medium: #f0a94b;
      --medium-soft: #453317;
      --low: #4fd1a5;
      --low-soft: #123c2e;
      --shadow: 0 1px 3px rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #111418;
    --surface: #1a1f26;
    --surface-2: #232a33;
    --text: #e8eaee;
    --text-2: #9aa4b2;
    --border: #2e3742;
    --accent: #5b95f5;
    --accent-soft: #1e3a5f;
    --high: #f47272;
    --high-soft: #4a1d1d;
    --medium: #f0a94b;
    --medium-soft: #453317;
    --low: #4fd1a5;
    --low-soft: #123c2e;
    --shadow: 0 1px 3px rgba(0, 0, 0, .4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header.site-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: .75rem;
    flex-wrap: wrap;
  }
  .logo { font-size: 1.25rem; font-weight: 700; letter-spacing: .02em; }
  .logo .accent { color: var(--accent); }
  .header-sub { color: var(--text-2); font-size: .85rem; }
  .header-right { margin-left: auto; display: flex; gap: .5rem; align-items: center; }
  .theme-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: .35rem .7rem;
    cursor: pointer;
    font-size: .85rem;
  }

  .layout {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr);
    gap: 1.5rem;
    max-width: 1200px;
    margin: 1.5rem auto;
    padding: 0 1.5rem;
  }
  @media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  aside.sidebar {
    align-self: start;
    position: sticky;
    top: 5rem;
    min-width: 0;
  }
  @media (max-width: 860px) { aside.sidebar { position: static; } }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .panel h3 {
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-2);
    margin-bottom: .6rem;
  }
  .week-list { list-style: none; }
  .week-list li { margin-bottom: .25rem; }
  .week-list button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text);
    padding: .45rem .6rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: .9rem;
    font-family: inherit;
  }
  .week-list button:hover { background: var(--surface-2); }
  .week-list button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .week-list .wk-date { display: block; font-size: .75rem; color: var(--text-2); }
  .topic-nav { list-style: none; }
  .topic-nav a {
    display: block;
    padding: .3rem .6rem;
    border-radius: 8px;
    font-size: .88rem;
    color: var(--text);
  }
  .topic-nav a:hover { background: var(--surface-2); text-decoration: none; }
  .topic-nav .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: .5rem; }

  main { min-width: 0; }
  .report-header {
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 10%, var(--surface)), var(--surface) 55%);
    border: 1px solid var(--border);
    border-top: 4px solid var(--accent);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 1.5rem 1.75rem;
    margin-bottom: 1.25rem;
  }
  .report-header .period {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
    font-size: .8rem;
    letter-spacing: .04em;
    padding: .25rem .8rem;
    border-radius: 99px;
  }
  .report-header h1 { font-size: 1.5rem; margin: .7rem 0 .6rem; line-height: 1.4; }
  .report-header .summary { color: var(--text-2); font-size: .95rem; }

  .highlights {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.25rem;
  }
  .highlights h2 { font-size: 1.05rem; margin-bottom: .8rem; }
  .highlights ol { list-style: none; counter-reset: hl; display: grid; gap: .5rem; }
  .highlights li {
    counter-increment: hl;
    display: flex;
    gap: .75rem;
    align-items: flex-start;
    font-size: .93rem;
    background: var(--surface-2);
    border-radius: 10px;
    padding: .65rem .9rem;
  }
  .highlights li::before {
    content: counter(hl);
    flex-shrink: 0;
    width: 1.5rem;
    height: 1.5rem;
    margin-top: .15rem;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: .78rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  section.topic {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 1.25rem;
    overflow: hidden;
  }
  .topic-head {
    padding: .9rem 1.4rem;
    background: color-mix(in srgb, var(--tc, var(--accent)) 9%, var(--surface));
    border-bottom: 1px solid color-mix(in srgb, var(--tc, var(--accent)) 25%, var(--border));
    border-left: 5px solid var(--tc, var(--accent));
    display: flex;
    align-items: center;
    gap: .7rem;
    flex-wrap: wrap;
  }
  .topic-head .dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; background: var(--tc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--tc) 22%, transparent); }
  .topic-head h2 { font-size: 1.12rem; }
  .topic-head .count {
    margin-left: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-2);
    font-size: .76rem;
    font-weight: 600;
    padding: .15rem .7rem;
    border-radius: 99px;
  }
  .topic-body { padding: 1rem 1.2rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: .9rem; }
  .item {
    border: 1px solid var(--border);
    border-left: 4px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    background: var(--surface);
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .item:hover { box-shadow: 0 4px 14px rgba(16, 24, 40, .10); transform: translateY(-1px); }
  .item.imp-high   { border-left-color: var(--high);   background: linear-gradient(90deg, color-mix(in srgb, var(--high) 5%, var(--surface)), var(--surface) 30%); }
  .item.imp-medium { border-left-color: var(--medium); background: linear-gradient(90deg, color-mix(in srgb, var(--medium) 5%, var(--surface)), var(--surface) 30%); }
  .item.imp-low    { border-left-color: var(--low);    background: linear-gradient(90deg, color-mix(in srgb, var(--low) 5%, var(--surface)), var(--surface) 30%); }
  .item-meta { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-bottom: .45rem; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    font-size: .72rem;
    font-weight: 700;
    padding: .16rem .65rem;
    border-radius: 99px;
    letter-spacing: .03em;
  }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .badge.high { background: var(--high-soft); color: var(--high); }
  .badge.medium { background: var(--medium-soft); color: var(--medium); }
  .badge.low { background: var(--low-soft); color: var(--low); }
  .item-date {
    font-size: .76rem;
    color: var(--text-2);
    background: var(--surface-2);
    padding: .16rem .6rem;
    border-radius: 99px;
  }
  .item h3 { font-size: 1.02rem; margin-bottom: .4rem; line-height: 1.55; }
  .item .content { font-size: .92rem; color: var(--text); margin-bottom: .65rem; }
  .action-box {
    background: color-mix(in srgb, var(--accent) 7%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--border));
    border-radius: 10px;
    padding: .6rem .9rem .6rem .8rem;
    font-size: .88rem;
    margin-bottom: .65rem;
    display: flex;
    gap: .55rem;
    align-items: flex-start;
  }
  .action-box .icon { flex-shrink: 0; margin-top: .05rem; }
  .action-box strong { color: var(--accent); }
  .sources { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; font-size: .78rem; color: var(--text-2); }
  .sources .label { font-weight: 600; margin-right: .1rem; }
  .sources a {
    display: inline-block;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-2);
    padding: .18rem .7rem;
    border-radius: 99px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sources a:hover { color: var(--accent); border-color: var(--accent); text-decoration: none; background: var(--accent-soft); }
  .no-update {
    color: var(--text-2);
    font-size: .9rem;
    text-align: center;
    padding: .9rem;
    background: var(--surface-2);
    border-radius: 10px;
  }

  /* ===== 手機專屬排版 ===== */
  @media (max-width: 640px) {
    header.site-header { padding: .6rem .9rem; gap: .3rem .6rem; }
    .logo { font-size: 1.05rem; }
    .header-sub { display: none; }
    .theme-btn { padding: .25rem .6rem; font-size: .78rem; }

    .layout { margin: .8rem auto; padding: 0 .7rem; gap: .4rem; }
    aside.sidebar .panel { padding: .65rem .8rem; margin-bottom: .6rem; border-radius: 10px; }
    .panel h3 { margin-bottom: .45rem; font-size: .72rem; }

    /* 週報存檔 → 水平滑動膠囊列 */
    .week-list { display: flex; overflow-x: auto; gap: .45rem; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .week-list::-webkit-scrollbar { display: none; }
    .week-list li { margin-bottom: 0; flex-shrink: 0; }
    .week-list button {
      white-space: nowrap;
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: .32rem .85rem;
      font-size: .84rem;
    }
    .week-list button.active { border-color: var(--accent); }
    .week-list .wk-date { display: inline; margin-left: .4rem; font-size: .72rem; }

    /* 追蹤主題 → 水平滑動膠囊列 */
    .topic-nav { display: flex; overflow-x: auto; gap: .4rem; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .topic-nav::-webkit-scrollbar { display: none; }
    .topic-nav li { flex-shrink: 0; }
    .topic-nav a {
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: .28rem .75rem;
      font-size: .8rem;
      white-space: nowrap;
    }
    .topic-nav .dot { width: 7px; height: 7px; margin-right: .35rem; vertical-align: .05rem; }

    .report-header { padding: 1rem 1.1rem; border-radius: 12px; }
    .report-header .period { font-size: .72rem; padding: .2rem .65rem; }
    .report-header h1 { font-size: 1.18rem; margin: .55rem 0 .5rem; }
    .report-header .summary { font-size: .88rem; }

    .highlights { padding: .9rem 1rem; border-radius: 12px; margin-bottom: 1rem; }
    .highlights h2 { font-size: .98rem; }
    .highlights li { font-size: .86rem; padding: .55rem .7rem; gap: .55rem; }
    .highlights li::before { width: 1.3rem; height: 1.3rem; font-size: .7rem; }

    section.topic { border-radius: 12px; margin-bottom: 1rem; }
    .topic-head { padding: .65rem .9rem; gap: .5rem; border-left-width: 4px; }
    .topic-head h2 { font-size: .98rem; }
    .topic-head .dot { width: 9px; height: 9px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--tc) 22%, transparent); }
    .topic-head .count { font-size: .7rem; padding: .1rem .55rem; }

    .topic-body { padding: .7rem .6rem; gap: .7rem; }
    .item { padding: .8rem .85rem; border-radius: 10px; }
    .item:hover { transform: none; }
    .item-meta { gap: .4rem; margin-bottom: .4rem; }
    .badge { font-size: .68rem; padding: .13rem .55rem; }
    .item-date { font-size: .7rem; padding: .13rem .5rem; }
    .item h3 { font-size: .96rem; line-height: 1.5; }
    .item .content { font-size: .86rem; line-height: 1.65; }
    .action-box { font-size: .83rem; padding: .55rem .7rem; gap: .45rem; border-radius: 8px; }
    .sources { font-size: .74rem; gap: .35rem; }
    .sources a { padding: .16rem .6rem; }

    footer { padding: 1.2rem .9rem 2rem; font-size: .74rem; }
  }

  .empty-state, .loading {
    text-align: center;
    color: var(--text-2);
    padding: 4rem 1rem;
    font-size: .95rem;
  }
  footer {
    text-align: center;
    color: var(--text-2);
    font-size: .8rem;
    padding: 2rem 1rem 3rem;
  }
</style>
</head>
<body>
<header class="site-header">
  <span class="logo" id="siteLogo">🛡️ 資安合規<span class="accent">週報</span></span>
  <span class="header-sub">EU AI Act · CRA · NIS2 · CMMC · ISO 27000 · ISO 42001 · TISAX</span>
  <div class="header-right">
    <button class="theme-btn" id="langToggle" title="切換語言 / Switch language">EN</button>
    <button class="theme-btn" id="themeToggle" title="切換深淺色 / Toggle theme">🌓</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="panel">
      <h3 id="archiveTitle">週報存檔</h3>
      <ul class="week-list" id="weekList"><li class="loading" style="padding:.5rem">載入中…</li></ul>
    </div>
    <div class="panel">
      <h3 id="topicsTitle">追蹤主題</h3>
      <ul class="topic-nav" id="topicNav"></ul>
    </div>
  </aside>

  <main id="main">
    <div class="loading">正在載入週報資料…</div>
  </main>
</div>

<footer id="siteFooter">
  資安合規週報 — 每週一 08:00 自動更新 · 由 Claude 彙整公開資訊產生，重要決策請以官方原文為準
</footer>

<script>
const TOPICS = [
  { key: "highlights",  name: { zh: "本週焦點", en: "Weekly Highlights" },       color: "#8b5cf6" },
  { key: "eu-ai-act",   name: { zh: "EU AI Act", en: "EU AI Act" },              color: "#2563eb" },
  { key: "eu-cra",      name: { zh: "EU CRA", en: "EU CRA" },                    color: "#0891b2" },
  { key: "nis2",        name: { zh: "EU NIS2", en: "EU NIS2" },                  color: "#059669" },
  { key: "cmmc",        name: { zh: "CMMC", en: "CMMC" },                        color: "#d97706" },
  { key: "iso27000",    name: { zh: "ISO 27000 系列", en: "ISO 27000 Series" },  color: "#dc2626" },
  { key: "iso42001",    name: { zh: "ISO 42001", en: "ISO 42001" },              color: "#db2777" },
  { key: "tisax",       name: { zh: "TISAX", en: "TISAX" },                      color: "#7c3aed" },
  { key: "incidents",   name: { zh: "重大資安事件", en: "Major Incidents" },      color: "#64748b" }
];
const IMPORTANCE = {
  zh: { high: "高度關注", medium: "持續留意", low: "一般資訊" },
  en: { high: "High Priority", medium: "Watch", low: "Info" }
};
const UI = {
  zh: {
    logo: '🛡️ 資安合規<span class="accent">週報</span>',
    archive: "週報存檔", topics: "追蹤主題", highlights: "⭐ 本週焦點",
    published: "發布日期", action: "建議行動：", sources: "來源",
    noUpdate: "✓ 本週無重大更新", count: n => `${n} 則`,
    loading: "載入週報中…", loadFail: id => `載入 ${id} 失敗。`, noReports: "尚無週報資料。",
    indexFail: '無法載入 reports/index.json。<br>若你是直接以 file:// 開啟本頁，請改用本機伺服器（例如 <code>python3 -m http.server</code>）或部署到 GitHub Pages 後瀏覽。',
    footer: "資安合規週報 — 每週一 08:00 自動更新 · 由 Claude 彙整公開資訊產生，重要決策請以官方原文為準",
    langBtn: "EN", htmlLang: "zh-Hant"
  },
  en: {
    logo: '🛡️ Security &amp; Compliance <span class="accent">Weekly</span>',
    archive: "Archive", topics: "Topics", highlights: "⭐ Weekly Highlights",
    published: "Published", action: "Recommended action: ", sources: "Sources",
    noUpdate: "✓ No major updates this week", count: n => `${n} item${n === 1 ? "" : "s"}`,
    loading: "Loading report…", loadFail: id => `Failed to load ${id}.`, noReports: "No reports yet.",
    indexFail: 'Could not load reports/index.json.<br>If you opened this page via file://, serve it locally (e.g. <code>python3 -m http.server</code>) or browse the deployed GitHub Pages site.',
    footer: "Security & Compliance Weekly — auto-updated every Monday 08:00 (UTC+8) · Compiled by Claude from public sources; consult official texts for decisions",
    langBtn: "中", htmlLang: "en"
  }
};

let lang = localStorage.getItem("lang") || "zh";
let reportsIndex = [];
let currentId = null;
let currentReport = null;

function L(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  return v[lang] ?? v.zh ?? v.en ?? "";
}

function topicMeta(key) {
  return TOPICS.find(t => t.key === key) || { key, name: { zh: key, en: key }, color: "#64748b" };
}

function applyChrome() {
  const t = UI[lang];
  document.documentElement.lang = t.htmlLang;
  document.getElementById("siteLogo").innerHTML = t.logo;
  document.getElementById("archiveTitle").textContent = t.archive;
  document.getElementById("topicsTitle").textContent = t.topics;
  document.getElementById("siteFooter").textContent = t.footer;
  document.getElementById("langToggle").textContent = t.langBtn;
}

async function loadIndex() {
  try {
    const res = await fetch("reports/index.json", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    reportsIndex = await res.json();
  } catch (e) {
    document.getElementById("main").innerHTML = `<div class="empty-state">${UI[lang].indexFail}</div>`;
    document.getElementById("weekList").innerHTML = "";
    return;
  }
  renderWeekList();
  if (reportsIndex.length > 0) {
    const hash = location.hash.replace("#", "");
    const target = reportsIndex.find(r => r.id === hash) || reportsIndex[0];
    loadReport(target.id);
  } else {
    document.getElementById("main").innerHTML = `<div class="empty-state">${UI[lang].noReports}</div>`;
  }
}

function renderWeekList() {
  const ul = document.getElementById("weekList");
  ul.innerHTML = "";
  for (const r of reportsIndex) {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.dataset.id = r.id;
    btn.innerHTML = `${esc(L(r.title)) || r.id}<span class="wk-date">${esc(L(r.period))}</span>`;
    btn.addEventListener("click", () => loadReport(r.id));
    li.appendChild(btn);
    ul.appendChild(li);
  }
  markActiveWeek();
}

function markActiveWeek() {
  document.querySelectorAll(".week-list button").forEach(b =>
    b.classList.toggle("active", b.dataset.id === currentId));
}

async function loadReport(id) {
  currentId = id;
  location.hash = id;
  markActiveWeek();
  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading">${UI[lang].loading}</div>`;
  let report;
  try {
    const res = await fetch(`reports/${id}.json`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    report = await res.json();
  } catch (e) {
    main.innerHTML = `<div class="empty-state">${UI[lang].loadFail(id)}</div>`;
    return;
  }
  currentReport = report;
  renderReport(report);
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

function renderReport(r) {
  const t = UI[lang];
  const main = document.getElementById("main");
  let html = `
    <div class="report-header">
      <div class="period">📅 ${esc(L(r.period))}｜${t.published}：${esc(r.publishedAt)}</div>
      <h1>${esc(L(r.title))}</h1>
      <p class="summary">${esc(L(r.summary))}</p>
    </div>`;

  if (r.highlights && r.highlights.length) {
    html += `<div class="highlights" id="topic-highlights"><h2>${t.highlights}</h2><ol>` +
      r.highlights.map(h => `<li><span>${esc(L(h))}</span></li>`).join("") + `</ol></div>`;
  }

  const navItems = [];
  if (r.highlights && r.highlights.length) navItems.push("highlights");

  for (const sec of (r.sections || [])) {
    const meta = topicMeta(sec.topic);
    navItems.push(sec.topic);
    const secName = (sec.name && typeof sec.name === "object") ? L(sec.name)
      : (lang === "zh" && typeof sec.name === "string") ? sec.name : L(meta.name);
    html += `
    <section class="topic" id="topic-${esc(sec.topic)}" style="--tc:${meta.color}">
      <div class="topic-head">
        <span class="dot"></span>
        <h2>${esc(secName)}</h2>
        <span class="count">${t.count((sec.items || []).length)}</span>
      </div>
      <div class="topic-body">`;
    if (!sec.items || sec.items.length === 0) {
      html += `<div class="no-update">${t.noUpdate}</div>`;
    } else {
      for (const it of sec.items) {
        const imp = IMPORTANCE.zh[it.importance] ? it.importance : "low";
        html += `
        <article class="item imp-${imp}">
          <div class="item-meta">
            <span class="badge ${imp}">${IMPORTANCE[lang][imp]}</span>
            ${it.date ? `<span class="item-date">📅 ${esc(L(it.date))}</span>` : ""}
          </div>
          <h3>${esc(L(it.title))}</h3>
          <p class="content">${esc(L(it.content))}</p>
          ${it.action ? `<div class="action-box"><span class="icon">💡</span><div><strong>${t.action}</strong>${esc(L(it.action))}</div></div>` : ""}
          ${(it.sources && it.sources.length) ? `<div class="sources"><span class="label">${t.sources}</span>` +
            it.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.title)}">${esc(s.title)} ↗</a>`).join("") +
            `</div>` : ""}
        </article>`;
      }
    }
    html += `</div></section>`;
  }
  main.innerHTML = html;
  renderTopicNav(navItems);
}

function renderTopicNav(keys) {
  const ul = document.getElementById("topicNav");
  ul.innerHTML = "";
  for (const key of keys) {
    const meta = topicMeta(key);
    const li = document.createElement("li");
    li.innerHTML = `<a href="#topic-${meta.key}"><span class="dot" style="background:${meta.color}"></span>${esc(L(meta.name))}</a>`;
    li.querySelector("a").addEventListener("click", ev => {
      ev.preventDefault();
      const el = document.getElementById(`topic-${meta.key}`);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    ul.appendChild(li);
  }
}

document.getElementById("themeToggle").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = getComputedStyle(document.body).backgroundColor !== "rgb(246, 247, 249)";
  root.setAttribute("data-theme", dark ? "light" : "dark");
});

document.getElementById("langToggle").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  localStorage.setItem("lang", lang);
  applyChrome();
  renderWeekList();
  if (currentReport) renderReport(currentReport);
});

applyChrome();
loadIndex();
</script>
</body>
</html>
